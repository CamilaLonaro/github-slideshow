<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts-local.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{
  background:#2E0B15;
  color:#F4EDE2;
  font-family:"Manrope",sans-serif;
  padding:108px 92px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.glow{position:absolute;width:900px;height:900px;left:-280px;top:-320px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,161,74,.13) 0%,rgba(201,161,74,0) 68%);}
.top{display:flex;justify-content:space-between;align-items:baseline;position:relative;z-index:2}
.kicker{font-size:21px;letter-spacing:.26em;text-transform:uppercase;font-weight:700;color:#C9A14A}
.num{font-size:21px;letter-spacing:.14em;color:#8C6F58;font-weight:700}
.mid{position:relative;z-index:2;margin:auto 0}
.rule{width:96px;height:3px;background:#C9A14A;margin-bottom:52px}
h1{font-family:"Bodoni Moda",serif;font-weight:600;font-size:86px;line-height:1.1;letter-spacing:-.005em}
h1 em{font-style:italic;color:#E4C77E;display:block;margin-top:14px}
.sub{margin-top:54px;font-size:28px;line-height:1.55;color:#CBB3A8;max-width:20em;font-weight:500}
.bot{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:2}
.handle{font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:#C9A14A;font-weight:700}
.tag{font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:#7D6255;margin-top:12px;font-weight:700}
.mark{text-align:right}
.word{font-family:"Bodoni Moda",serif;font-size:40px;letter-spacing:.2em;color:#F4EDE2}
.dotwrap{display:flex;justify-content:flex-end;align-items:center;gap:13px;margin-top:16px}
.dline{width:56px;height:1px;background:rgba(201,161,74,.55)}
.dot{width:19px;height:19px;border-radius:50%;background:#C9A14A}
</style></head><body>
<div class="glow"></div>
<div class="top"><div class="kicker">Ponto de Decisão</div><div class="num">#001</div></div>
<div class="mid">
  <div class="rule"></div>
  <h1>A IA não vai tomar<br>a sua decisão.<em>Vai tirar as suas desculpas.</em></h1>
  <div class="sub">São 16 anos vendo gente esperar o dado perfeito para decidir. Ele nunca chega.</div>
</div>
<div class="bot">
  <div><div class="handle">@camilalonaro</div><div class="tag">Inteligência para decidir</div></div>
  <div class="mark"><div class="word">LONARO</div><div class="dotwrap"><div class="dline"></div><div class="dot"></div></div></div>
</div>
</body></html>
