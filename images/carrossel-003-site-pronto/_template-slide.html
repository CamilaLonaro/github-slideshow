<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Manrope:wght@400..800&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{background:#F2EFE8;color:#1A1A1A;font-family:"Manrope",sans-serif;padding:96px 96px 88px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:baseline}
.kicker{font-size:17px;letter-spacing:.34em;text-transform:uppercase;font-weight:700;color:#B08D45}
.num{font-size:17px;letter-spacing:.2em;color:#9A927F;font-weight:700}
.mid{margin:auto 0}
.rule{width:64px;height:2px;background:#B08D45;margin-bottom:48px}
h1{font-family:"Bodoni Moda",serif;font-weight:500;font-size:__H1__;line-height:1.12;letter-spacing:-.005em;color:#1A1A1A;text-wrap:balance}
h1 em{font-style:italic;font-weight:400;color:#B08D45}
.sub{margin-top:48px;font-size:26px;line-height:1.5;color:#3A3A3A;max-width:22em;font-weight:500}
.list{margin-top:48px;display:grid;grid-template-columns:1fr 1fr;gap:22px 40px}
.list div{font-size:30px;font-weight:600;color:#1A1A1A;padding-left:28px;position:relative}
.list div::before{content:"\25C6";position:absolute;left:0;top:4px;font-size:18px;color:#B08D45}
.bot{border-top:1px solid rgba(176,141,69,.45);padding-top:30px;display:flex;justify-content:space-between;align-items:center}
.who{font-size:17px;letter-spacing:.34em;text-transform:uppercase;font-weight:700;color:#3A3A3A}
.who b{color:#B08D45;margin:0 10px}
.tag{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#9A927F;margin-top:12px;font-weight:700}
.handle{font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#B08D45;font-weight:700}
.arrow{font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#9A927F;font-weight:700}
</style></head><body>
<div class="top"><div class="kicker">Ponto de Decisão</div><div class="num">#003 · __N__/6</div></div>
<div class="mid"><div class="rule"></div>__BODY__</div>
<div class="bot"><div><div class="who">Camila Lonaro<b>&#9670;</b>Evidência</div><div class="tag">Tecnologia executa. Liderança forma.</div></div><div class="__RCLS__">__RIGHT__</div></div>
</body></html>
