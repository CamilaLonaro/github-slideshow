<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts-local.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:"Manrope",sans-serif;background:#2E0B15}
.ph{position:absolute;inset:0;background-image:url("__IMG__");background-size:cover;background-position:center}
.scrim{position:absolute;left:0;right:0;bottom:0;height:56%;
  background:linear-gradient(to bottom,rgba(46,11,21,0) 0%,rgba(46,11,21,.55) 44%,rgba(46,11,21,.93) 100%)}
.edge{position:absolute;inset:0;box-shadow:inset 0 0 0 10px #2E0B15}
.foot{position:absolute;left:78px;right:78px;bottom:92px;display:flex;justify-content:space-between;align-items:flex-end;gap:36px}
.line{font-family:"Bodoni Moda",serif;font-weight:400;font-size:40px;line-height:1.24;color:#F4EDE2;max-width:15em;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.line em{font-style:italic;color:#E4C77E}
.mark{text-align:right;flex-shrink:0}
.word{font-family:"Bodoni Moda",serif;font-size:29px;letter-spacing:.2em;color:#F4EDE2;opacity:.93}
.dotwrap{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:11px}
.dline{width:40px;height:1px;background:rgba(201,161,74,.6)}
.dot{width:14px;height:14px;border-radius:50%;background:#C9A14A}
</style></head><body>
<div class="ph"></div><div class="scrim"></div><div class="edge"></div>
<div class="foot">
  <div class="line">__TXT__</div>
  <div class="mark"><div class="word">LONARO</div><div class="dotwrap"><div class="dline"></div><div class="dot"></div></div></div>
</div>
</body></html>
