<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Manrope:wght@400..800&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:"Manrope",sans-serif;background:#F2EFE8}
.ph{position:absolute;inset:0;background-image:url("__IMG__");background-size:cover;background-position:center}
.frame{position:absolute;inset:0;box-shadow:inset 0 0 0 18px #F2EFE8}
.card{position:absolute;left:18px;right:18px;bottom:18px;background:#F2EFE8;padding:__PAD__ 58px 40px 58px}
.kick{font-size:15px;letter-spacing:.32em;text-transform:uppercase;font-weight:700;color:#B08D45;margin-bottom:22px}
.line{font-family:"Bodoni Moda",serif;font-weight:400;font-size:44px;line-height:1.22;color:#1A1A1A;max-width:19em;margin-bottom:34px}
.line em{font-style:italic;color:#B08D45}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(176,141,69,.45);padding-top:24px}
.who{font-size:14px;letter-spacing:.34em;text-transform:uppercase;font-weight:700;color:#3A3A3A}
.who b{color:#B08D45;font-weight:700;margin:0 8px}
.ev{font-family:"Bodoni Moda",serif;font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:#9A927F}
</style></head><body>
<div class="ph"></div><div class="frame"></div>
<div class="card">
  __BODY__
  <div class="foot"><div class="who">Camila Lonaro<b>&#9670;</b>Evidência</div><div class="ev">Mercado Livre Experience 2026</div></div>
</div>
</body></html>
