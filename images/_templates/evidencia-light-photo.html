<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Manrope:wght@400..800&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:"Manrope",sans-serif;background:#F2EFE8}
.ph{position:absolute;left:18px;right:18px;top:18px;height:__PH__px;background-image:url("__IMG__");background-size:cover;background-position:__POS__}
.card{position:absolute;left:18px;right:18px;bottom:18px;top:__CARDTOP__px;background:#F2EFE8;padding:44px 58px 40px}
.kick{display:flex;justify-content:space-between;font-size:15px;letter-spacing:.32em;text-transform:uppercase;font-weight:700;color:#B08D45;margin-bottom:22px}
.kick span:last-child{color:#9A927F}
h1{font-family:"Bodoni Moda",serif;font-weight:500;font-size:__H1__;line-height:1.12;color:#1A1A1A;text-wrap:balance}
h1 em{font-style:italic;font-weight:400;color:#B08D45}
.sub{margin-top:22px;font-size:22px;line-height:1.5;color:#3A3A3A;max-width:30em;font-weight:500}
.foot{position:absolute;left:58px;right:58px;bottom:40px;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(176,141,69,.45);padding-top:22px}
.who{font-size:15px;letter-spacing:.34em;text-transform:uppercase;font-weight:800;color:#1A1A1A}
.who b{color:#B08D45;margin:0 8px}
.cred{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#5C574E;margin-top:10px;font-weight:700}
.right{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:#B08D45;font-weight:800;white-space:nowrap}
</style></head><body>
<div class="ph"></div>
<div class="card">
  <div class="kick"><span>__KICKL__</span><span>__KICKR__</span></div>
  <h1>__H1T__</h1>
  __SUB__
  <div class="foot"><div><div class="who">Camila Lonaro<b>&#9670;</b>Evidência</div><div class="cred">__CRED__</div></div><div class="right">__RIGHT__</div></div>
</div>
</body></html>
